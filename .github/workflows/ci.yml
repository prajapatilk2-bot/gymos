name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://gymos:gymos_dev_pw@localhost:5432/gymos_test
  BETTER_AUTH_SECRET: ci-test-secret-not-for-production-0000000000
  BETTER_AUTH_URL: http://localhost:3000
  SESSION_INACTIVITY_TIMEOUT_MINUTES: "30"
  SEED_ADMIN_EMAIL: admin@gymos.test
  SEED_ADMIN_PASSWORD: ChangeMe!2026CI

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymos
          POSTGRES_PASSWORD: gymos_dev_pw
          POSTGRES_DB: gymos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed database for E2E
        run: pnpm db:seed

      - name: E2E smoke test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
